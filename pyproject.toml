[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "images-agent"
version = "0.1.0"
description = "CLI agent for Pictures library: exact duplicates and vision-based age sorting via Ollama Cloud."
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
images-agent = "images_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["images_agent*"]
