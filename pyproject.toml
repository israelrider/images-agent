[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "images-agent"
version = "0.1.0"
description = "CLI agent for Pictures library: CLIP vector search plus optional hybrid Ollama vision rerank"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "fastembed>=0.7.2",
    "numpy>=1.26.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Face grouping (the `faces`/`cluster`/`albums` commands). Kept optional so the
# original CLIP search install stays lightweight. Install with:
#   pip install -e ".[faces]"
faces = [
    "insightface>=0.7.3",
    "onnxruntime>=1.16",      # swap for onnxruntime-gpu to use --gpu
    "opencv-python>=4.8",
    "pillow>=10.0",
    "pillow-heif>=0.13",      # HEIC/iPhone support
]

[project.scripts]
images-agent = "images_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["images_agent*"]
